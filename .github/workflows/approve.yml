name: approve

# "approve <slug>": an episode uploaded private and without a date (while config
# release.manual_left > 0) gets the nearest free slot - Wednesday or Saturday
# 17:00 Europe/Berlin - and one manual release fewer is left. Once none is left,
# uploads are scheduled by themselves.
run-name: approve ${{ inputs.slug }}
on:
  workflow_dispatch:
    inputs:
      slug:
        description: the episode to schedule

permissions:
  contents: write

concurrency:
  group: upload
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: 1
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - run: python automation/release.py approve "${{ inputs.slug }}"
