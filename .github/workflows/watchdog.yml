name: watchdog

# Every half hour (GitHub skipped most hourly runs on 17-18.10), on odd minutes (GitHub runs schedules late, and on the hour is
# its busiest moment). Recovers failed or hung builds, keeps two videos
# scheduled ahead, fills a slot about to go empty, emails the owner when
# something cannot be recovered, and commits the state once a day so the
# repository never goes quiet long enough for GitHub to switch schedules off.
# See automation/watchdog.py.
on:
  schedule:
    - cron: "7,37 * * * *"        # twice an hour: GitHub drops many scheduled runs
  workflow_dispatch:
    inputs:
      test_email:
        description: only send a test email through the failure-notice path
        default: "false"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - name: Watch
        id: watch
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then python automation/watchdog.py --test-email; exit 0; fi
          python automation/watchdog.py
      - name: Commit the state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/watchdog.json state/episodes.json
          [ "${{ steps.watch.outputs.commit }}" = "true" ] && git add state/heartbeat.json
          git diff --cached --quiet && exit 0
          git commit -m "watchdog: state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 8)); done
          exit 1
      - name: Email if the watchdog itself fails
        if: failure()
        run: |
          n=$(gh issue list -R ${{ github.repository }} --label run-log --state open --json number --jq '.[0].number // empty')
          [ -n "$n" ] && gh issue comment "$n" -R ${{ github.repository }} --body "@${{ github.repository_owner }} the watchdog failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
