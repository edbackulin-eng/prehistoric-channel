name: watchdog

# Twice an hour on the schedule (GitHub drops many scheduled runs), and one run
# keeps itself going: it checks every 15 minutes for almost six hours and then
# starts its successor. Reruns failed builds, keeps two episodes ahead, uploads
# from the buffer once a YouTube token exists, emails the owner (run-log issue)
# when something cannot be recovered, commits a heartbeat once a day.
# See automation/watchdog.py.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: only send a test email through the failure-notice path
        default: "false"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - name: Watch every 15 minutes, then hand over to the next run
        if: inputs.test_email != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 5*3600 + 40*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase --autostash origin main || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; }
            python automation/watchdog.py > "$RUNNER_TEMP/out.txt" 2>&1 || true
            tail -40 "$RUNNER_TEMP/out.txt"
            commit=$(grep -o "^commit=.*" "$GITHUB_OUTPUT" 2>/dev/null | tail -1 | cut -d= -f2)
            git add state/watchdog.json
            [ "$commit" = "true" ] && git add state/heartbeat.json
            if ! git diff --cached --quiet; then
              git commit -q -m "watchdog: state $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break; sleep $((i * 8)); done
            fi
            : > "$GITHUB_OUTPUT"
            sleep 900
          done
          gh workflow run watchdog.yml --repo ${{ github.repository }}
      - name: Test email
        if: inputs.test_email == 'true'
        run: python automation/watchdog.py --test-email
      - name: Email if the watchdog itself fails
        if: failure()
        run: |
          n=$(gh issue list -R ${{ github.repository }} --label run-log --state open --json number --jq '.[0].number // empty')
          [ -n "$n" ] && gh issue comment "$n" -R ${{ github.repository }} --body "@${{ github.repository_owner }} the watchdog failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
