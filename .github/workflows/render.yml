name: render

# Render an episode on GitHub's machines. Kaggle's GPU has made the FLUX frames
# and the LTX-Video clips and nothing else (episode.yml); here, in parallel: a
# matrix of CPU jobs upscales every frame and clip and turns frames and photos
# into their 2.5D layers (pipeline/layers_cpu.py) while one job narrates with
# Piper. Then one job prepares the inputs (species check, plan), one job per
# part renders its stretch of picture, and a last job joins the parts with
# -c copy, mixes the sound, makes the thumbnails and the credits, and releases
# the episode: uploaded on the nearest free slot, or into the buffer.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: episode
        default: lebende-fossilien
      res:
        description: 2160p or 1440p
        default: 2160p
      parts:
        description: parts rendered in parallel
        default: "20"
      layer_jobs:
        description: CPU jobs for upscaling and the 2.5D layers, in parallel
        default: "12"
      gpu_run:
        description: the episode.yml run whose GPU results (FLUX frames, LTX clips) to use
        default: ""
      layers_run:
        description: reuse the layers and narration of this earlier render run (its id), instead of making them again
        default: ""
      release:
        description: upload (or buffer) the finished episode
        default: "false"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: render-${{ inputs.slug }}-${{ inputs.res }}
  cancel-in-progress: false

env:
  PYTHONUTF8: 1
  SLUG: ${{ inputs.slug }}
  RES: ${{ inputs.res }}

jobs:
  shards:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.n.outputs.list }}
    steps:
      - id: n
        run: echo "list=$(python3 -c "print(list(range(int('${{ inputs.layer_jobs }}'))))")" >> "$GITHUB_OUTPUT"

  layers:
    needs: shards
    if: inputs.layers_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJSON(needs.shards.outputs.list) }}
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # transformers 5 needs torch >= 2.6 and, without it, fails as "name 'torch' is not defined" (28.10)
      - name: CPU models (torch for the CPU, the 2.5D models' libraries)
        run: |
          pip install -q torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==4.56.2 timm kornia einops spandrel==0.4.1 rembg onnxruntime \
            opencv-python-headless pillow "numpy<2.2" kaggle
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.u2net
            assets/models/layers
          key: layers-models-v1
      - name: The FLUX frames and LTX clips (from the episode run)
        if: inputs.gpu_run != ''
        uses: actions/download-artifact@v5
        with:
          name: gpu-${{ inputs.slug }}
          path: gpu/
          run-id: ${{ inputs.gpu_run }}
          github-token: ${{ github.token }}
      - name: The FLUX frames from Kaggle (no episode run given)
        if: inputs.gpu_run == ''
        run: python gpu/kaggle_once.py fetch recon animate
      - name: 2.5D layers, shard ${{ matrix.k }} of ${{ inputs.layer_jobs }}
        run: python -m pipeline.layers_cpu "$SLUG" ${{ matrix.k }} ${{ inputs.layer_jobs }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: layers-${{ matrix.k }}
          retention-days: 2
          compression-level: 0
          path: work/${{ inputs.slug }}/layers_cpu/

  narration:
    if: inputs.layers_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python automation/fetch_models.py
      - name: German narration (Piper, Thorsten, CPU)
        run: python -c "import sys; sys.path.insert(0, '.'); from automation import build_doc; print(build_doc.narration('$SLUG')[1]['report'])"
      - uses: actions/upload-artifact@v5
        with:
          name: narration
          retention-days: 2
          path: work/${{ inputs.slug }}/inputs/narration_*

  prepare:
    needs: [layers, narration]
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.layers.result) && contains(fromJSON('["success","skipped"]'), needs.narration.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      GEMINI_API_KEY_PH: ${{ secrets.GEMINI_API_KEY_PH }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt modal==1.6.2
      - name: Modal credentials (trim stray whitespace; ID is ak-, secret as-)
        run: |
          id="$(printf '%s' "$MODAL_TOKEN_ID" | tr -d '[:space:]')"
          sec="$(printf '%s' "$MODAL_TOKEN_SECRET" | tr -d '[:space:]')"
          case "$id" in as-*) t="$id"; id="$sec"; sec="$t"; echo "ID and secret were swapped";; esac
          echo "token id prefix: ${id:0:3}, secret prefix: ${sec:0:3}, lengths ${#id}/${#sec}"
          echo "::add-mask::$id"; echo "::add-mask::$sec"
          { echo "MODAL_TOKEN_ID=$id"; echo "MODAL_TOKEN_SECRET=$sec"; } >> "$GITHUB_ENV"
      - name: Models, music, atmosphere, maps
        run: python automation/fetch_assets.py
      - name: The FLUX report and thumbnail bases (from the episode run)
        if: inputs.gpu_run != ''
        uses: actions/download-artifact@v5
        with:
          name: gpu-${{ inputs.slug }}
          path: gpu/
          run-id: ${{ inputs.gpu_run }}
          github-token: ${{ github.token }}
      - name: The FLUX report from Kaggle (no episode run given)
        if: inputs.gpu_run == ''
        run: python gpu/kaggle_once.py fetch recon
      - uses: actions/download-artifact@v5
        with:
          pattern: layers-*
          merge-multiple: true
          path: work/${{ inputs.slug }}/layers_cpu/
          run-id: ${{ inputs.layers_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: narration
          path: work/${{ inputs.slug }}/inputs/
          run-id: ${{ inputs.layers_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: German narration, 2.5D layers, species check, plan, footage, voice lines
        run: python automation/build_doc.py prepare "$SLUG" --res "$RES" --parts "${{ inputs.parts }}"
      - id: plan
        run: |
          echo "parts=$(python -c "import json;p=json.load(open('work/$SLUG/plan.json'));print(json.dumps(list(range(len(p['parts'])))))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: inputs
          retention-days: 2
          compression-level: 0
          path: |
            work/${{ inputs.slug }}/plan.json
            work/${{ inputs.slug }}/inputs/
            state/llm_usage/
            cache/maps/
            assets/music/
            assets/ambience/
            assets/models/
            gpu/results_voice/

  part:
    needs: prepare
    # a skipped layers job (layers_run) would otherwise skip everything after prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJSON(needs.prepare.outputs.parts) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v5
        with:
          name: inputs
      - name: Render part ${{ matrix.k }}
        run: |
          start=$(date +%s)
          python automation/build_doc.py part "$SLUG" ${{ matrix.k }} --res "$RES"
          echo "wall_s=$(( $(date +%s) - start ))" | tee "work/$SLUG/parts_$RES/wall_${{ matrix.k }}.txt"
      - uses: actions/upload-artifact@v5
        with:
          name: part-${{ matrix.k }}
          retention-days: 2
          compression-level: 0
          path: work/${{ inputs.slug }}/parts_${{ inputs.res }}/

  merge:
    needs: part
    if: ${{ !cancelled() && needs.part.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GEMINI_API_KEY_PH: ${{ secrets.GEMINI_API_KEY_PH }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v5
        with:
          name: inputs
      - uses: actions/download-artifact@v5
        with:
          pattern: part-*
          merge-multiple: true
          path: work/${{ inputs.slug }}/parts_${{ inputs.res }}/
      - name: Join, sound, mux
        run: python automation/build_doc.py merge "$SLUG" --res "$RES"
      - name: Thumbnails (three variants, Gemini picks) and credits
        run: |
          pip install -q rembg onnxruntime
          python automation/make_thumbs.py "$SLUG" || echo "::warning::no readable thumbnail"
          python automation/credits.py "$SLUG"
      - name: Render time and the 25-minute forecast
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/forecast.py "$SLUG" "$RES" "${{ github.run_id }}" || true
      - name: Checks
        run: |
          f="work/$SLUG/release/video.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration,size,bit_rate -of compact "$f"
          ffmpeg -hide_banner -nostats -i "$f" -af ebur128=peak=true -f null - 2>&1 | tail -12
          ffmpeg -hide_banner -loglevel error -y -i "$f" -vf "fps=1/30,scale=480:-2,tile=8x7" -frames:v 1 "work/$SLUG/release/contact.jpg"
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ inputs.slug }}
          retention-days: 90
          compression-level: 0
          path: work/${{ inputs.slug }}/release/
      - uses: actions/upload-artifact@v5
        with:
          name: reports-${{ inputs.slug }}
          retention-days: 30
          path: |
            work/${{ inputs.slug }}/report_${{ inputs.res }}.json
            work/${{ inputs.slug }}/plan.json
            work/${{ inputs.slug }}/timing_${{ inputs.res }}.json
            work/${{ inputs.slug }}/inputs/kaggle_recon_report.json
            work/${{ inputs.slug }}/inputs/mask_check.json
            work/${{ inputs.slug }}/inputs/species_picks.json
      - name: Keep the quota record (the species check in prepare, the masks and thumbnails here)
        if: always() && inputs.release != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/llm_usage 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Quota usage of render ${{ github.run_id }}"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 10)); done
      - name: Release - upload on the nearest free slot, or keep in the buffer
        if: inputs.release == 'true'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q google-api-python-client google-auth
          python automation/release.py record "$SLUG" "${{ github.run_id }}"
          python automation/topics.py --done "$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/episodes.json topics/queue.json episodes/$SLUG/uploaded.json state/llm_usage 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Released $SLUG (render ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 10)); done
          exit 1
      - name: Email on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list -R ${{ github.repository }} --label run-log --state open --json number --jq '.[0].number // empty')
          [ -n "$n" ] && gh issue comment "$n" -R ${{ github.repository }} --body "@${{ github.repository_owner }} **render failed** ($SLUG): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
