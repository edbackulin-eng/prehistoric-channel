name: render

# Render an episode on GitHub's machines. Kaggle's GPU has made the FLUX frames
# and nothing else; here, in parallel: a matrix of CPU jobs turns every frame
# and photograph into its 2.5D layers (Real-ESRGAN, depth, masks, LaMa -
# pipeline/layers_cpu.py) while one job narrates with Piper. Then one job
# prepares the inputs (species check, plan), one job per part renders its
# stretch of picture, and a last job joins the parts with -c copy, mixes the
# sound and muxes. Started by hand only: this channel uploads nothing.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: episode
        default: living-fossils
      res:
        description: 2160p or 1440p
        default: 2160p
      parts:
        description: parts rendered in parallel
        default: "6"
      samples:
        description: also make the three German 40-second voice samples (A, B, C)
        default: "true"
      gpu_source:
        description: where the FLUX frames and voice lines are (kaggle; modal is no longer used)
        default: kaggle
      layer_jobs:
        description: CPU jobs for the 2.5D layers, in parallel
        default: "8"

permissions:
  contents: read
  actions: write

concurrency:
  group: render-${{ inputs.slug }}-${{ inputs.res }}
  cancel-in-progress: false

env:
  PYTHONUTF8: 1
  SLUG: ${{ inputs.slug }}
  RES: ${{ inputs.res }}

jobs:
  shards:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.n.outputs.list }}
    steps:
      - id: n
        run: echo "list=$(python3 -c "print(list(range(int('${{ inputs.layer_jobs }}'))))")" >> "$GITHUB_OUTPUT"

  layers:
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJSON(needs.shards.outputs.list) }}
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: CPU models (torch for the CPU, the 2.5D models' libraries)
        run: |
          pip install -q torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.48,<6" timm kornia einops spandrel==0.4.1 rembg onnxruntime \
            opencv-python-headless pillow "numpy<2.2" kaggle
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.u2net
            assets/models/layers
          key: layers-models-v1
      - name: The FLUX frames from Kaggle
        run: python gpu/kaggle_once.py fetch recon
      - name: 2.5D layers, shard ${{ matrix.k }} of ${{ inputs.layer_jobs }}
        run: python -m pipeline.layers_cpu "$SLUG" ${{ matrix.k }} ${{ inputs.layer_jobs }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: layers-${{ matrix.k }}
          retention-days: 2
          compression-level: 0
          path: work/${{ inputs.slug }}/layers_cpu/

  narration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python automation/fetch_models.py
      - name: German narration (Piper, Thorsten, CPU)
        run: python -c "import sys; sys.path.insert(0, '.'); from automation import build_doc; print(build_doc.narration('$SLUG')[1]['report'])"
      - uses: actions/upload-artifact@v5
        with:
          name: narration
          retention-days: 2
          path: work/${{ inputs.slug }}/inputs/narration_*

  prepare:
    needs: [layers, narration]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      GEMINI_API_KEY_PH: ${{ secrets.GEMINI_API_KEY_PH }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt modal==1.6.2
      - name: Modal credentials (trim stray whitespace; ID is ak-, secret as-)
        run: |
          id="$(printf '%s' "$MODAL_TOKEN_ID" | tr -d '[:space:]')"
          sec="$(printf '%s' "$MODAL_TOKEN_SECRET" | tr -d '[:space:]')"
          case "$id" in as-*) t="$id"; id="$sec"; sec="$t"; echo "ID and secret were swapped";; esac
          echo "token id prefix: ${id:0:3}, secret prefix: ${sec:0:3}, lengths ${#id}/${#sec}"
          echo "::add-mask::$id"; echo "::add-mask::$sec"
          { echo "MODAL_TOKEN_ID=$id"; echo "MODAL_TOKEN_SECRET=$sec"; } >> "$GITHUB_ENV"
      - name: Models, music, atmosphere, maps
        run: python automation/fetch_assets.py
      - name: The FLUX report and the voice lines from Kaggle
        if: inputs.gpu_source == 'kaggle'
        run: python gpu/kaggle_once.py fetch recon voice
      - uses: actions/download-artifact@v5
        with:
          pattern: layers-*
          merge-multiple: true
          path: work/${{ inputs.slug }}/layers_cpu/
      - uses: actions/download-artifact@v5
        with:
          name: narration
          path: work/${{ inputs.slug }}/inputs/
      - name: German narration, 2.5D layers, species check, plan, footage, voice lines
        run: python automation/build_doc.py prepare "$SLUG" --res "$RES" --parts "${{ inputs.parts }}"
      - id: plan
        run: |
          echo "parts=$(python -c "import json;p=json.load(open('work/$SLUG/plan.json'));print(json.dumps(list(range(len(p['parts'])))))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: inputs
          retention-days: 2
          compression-level: 0
          path: |
            work/${{ inputs.slug }}/plan.json
            work/${{ inputs.slug }}/inputs/
            cache/maps/
            assets/music/
            assets/ambience/
            assets/models/
            gpu/results_voice/

  part:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJSON(needs.prepare.outputs.parts) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v5
        with:
          name: inputs
      - name: Render part ${{ matrix.k }}
        run: |
          start=$(date +%s)
          python automation/build_doc.py part "$SLUG" ${{ matrix.k }} --res "$RES"
          echo "wall_s=$(( $(date +%s) - start ))" | tee "work/$SLUG/parts_$RES/wall_${{ matrix.k }}.txt"
      - uses: actions/upload-artifact@v5
        with:
          name: part-${{ matrix.k }}
          retention-days: 2
          compression-level: 0
          path: work/${{ inputs.slug }}/parts_${{ inputs.res }}/

  merge:
    needs: part
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GEMINI_API_KEY_PH: ${{ secrets.GEMINI_API_KEY_PH }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v5
        with:
          name: inputs
      - uses: actions/download-artifact@v5
        with:
          pattern: part-*
          merge-multiple: true
          path: work/${{ inputs.slug }}/parts_${{ inputs.res }}/
      - name: Join, sound, mux
        run: python automation/build_doc.py merge "$SLUG" --res "$RES"
      - name: Voice samples
        if: inputs.samples == 'true'
        run: python automation/build_doc.py samples "$SLUG" --res "$RES"
      - name: Thumbnails and credits
        if: inputs.res == '2160p'
        run: |
          python automation/make_thumbs.py "$SLUG" || echo "a thumbnail failed its readability check (see report)"
          python automation/credits.py "$SLUG"
      - name: Render time and the 25-minute forecast
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/forecast.py "$SLUG" "$RES" "${{ github.run_id }}"
      - name: A 1440p version for comparison, if 4K would take over an hour at 25 minutes
        if: inputs.res == '2160p'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat work/$SLUG/forecast_over_hour.txt)" = "yes" ]; then
            gh workflow run render.yml -R "${{ github.repository }}" -f slug="$SLUG" -f res=1440p -f samples=false \
              -f gpu_source="${{ inputs.gpu_source }}" -f layer_jobs="${{ inputs.layer_jobs }}"
          fi
      - name: Checks
        run: |
          f="work/$SLUG/video_$RES.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration,size,bit_rate -of compact "$f"
          ffmpeg -hide_banner -nostats -i "$f" -af ebur128=peak=true -f null - 2>&1 | tail -12
          ffmpeg -hide_banner -loglevel error -y -i "$f" -vf "fps=1/6,scale=480:-2,tile=6x6" -frames:v 1 "work/$SLUG/contact_$RES.jpg"
      - uses: actions/upload-artifact@v5
        with:
          name: video-${{ inputs.res }}
          retention-days: 5
          compression-level: 0
          path: |
            work/${{ inputs.slug }}/video_${{ inputs.res }}.mp4
            work/${{ inputs.slug }}/report_${{ inputs.res }}.json
            work/${{ inputs.slug }}/contact_${{ inputs.res }}.jpg
            work/${{ inputs.slug }}/plan.json
            work/${{ inputs.slug }}/samples_report.json
            work/${{ inputs.slug }}/timing_${{ inputs.res }}.json
            work/${{ inputs.slug }}/inputs/kaggle_recon_report.json
            work/${{ inputs.slug }}/inputs/mask_check.json
            work/${{ inputs.slug }}/inputs/species_check.json
            work/${{ inputs.slug }}/inputs/cpu_layers_report.json
            work/${{ inputs.slug }}/inputs/species_picks.json
            work/${{ inputs.slug }}/inputs/subtitles_de.srt
            test/
