name: requalify
run-name: requalify ${{ inputs.slug }} (render ${{ inputs.run_id }})
# A finished render checked again without rendering it again (owner 07.11): its picture,
# sound, plan and inputs from the render run's artifacts; new thumbnails (make_thumbs.py
# --episode-bases: the episode's species-checked animals, close up), the QA gate on the
# current code, its report in qa/<slug>/, and - passing - the release as in render.yml
# (private without a date while the first episodes wait for approval).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: episode
      run_id:
        description: the render run whose release-, reports- and inputs artifacts to use
      res:
        description: 2160p or 1440p
        default: 2160p
      thumbs:
        description: make the thumbnails again (episode bases)
        default: "true"

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: render-${{ inputs.slug }}-${{ inputs.res }}
  cancel-in-progress: false

jobs:
  requalify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUTF8: 1
      SLUG: ${{ inputs.slug }}
      RES: ${{ inputs.res }}
      GEMINI_API_KEY_PH: ${{ secrets.GEMINI_API_KEY_PH }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - name: Room for the picture (the release is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt rembg onnxruntime
      - uses: actions/download-artifact@v5
        with:
          name: inputs
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: reports-${{ inputs.slug }}
          path: work/${{ inputs.slug }}/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: release-${{ inputs.slug }}
          path: work/${{ inputs.slug }}/release/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: ls -la "work/$SLUG" "work/$SLUG/release" && df -h / | tail -1
      - name: Thumbnails from the episode's own animals (judge with fallback models)
        if: inputs.thumbs == 'true'
        run: |
          rm -f work/$SLUG/release/thumbnail*.jpg work/$SLUG/release/thumbnails_report.json
          python automation/make_thumbs.py "$SLUG" --episode-bases || echo "::warning::no thumbnail passed the judge"
      - name: QA gate on the current code, its report in qa/<slug>/
        id: qa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python automation/qa.py "$SLUG" --res "$RES" && echo "pass=true" >> "$GITHUB_OUTPUT" || echo "pass=false" >> "$GITHUB_OUTPUT"
          python -c "import json;q=json.load(open('work/$SLUG/release/qa.json'));[print(('ok  ' if c['ok'] else 'NO  ')+c['name']+': '+c.get('detail','')[:300]) for c in q['checks']]"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "qa/$SLUG" 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "QA report of $SLUG (requalify of render ${{ inputs.run_id }})"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 10)); done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: requalify-${{ inputs.slug }}
          retention-days: 30
          path: |
            work/${{ inputs.slug }}/release/qa.json
            work/${{ inputs.slug }}/release/thumbnail*.jpg
            work/${{ inputs.slug }}/release/thumbnails_report.json
      - name: Release - private without a date while the first episodes wait for approval
        if: steps.qa.outputs.pass == 'true'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q google-api-python-client google-auth
          rc=0; python automation/release.py record "$SLUG" "${{ inputs.run_id }}" || rc=$?
          if [ $rc = 2 ]; then python automation/topics.py --done "$SLUG" qa-failed
          elif [ $rc = 0 ]; then python automation/topics.py --done "$SLUG"
          else exit $rc; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state/episodes.json topics/queue.json "episodes/$SLUG/uploaded.json" state/llm_usage; do
            [ -e "$f" ] && git add -A "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -q -m "Released $SLUG (requalify of render ${{ inputs.run_id }}): $(python -c "import json;print(next(x['status'] for x in json.load(open('state/episodes.json')) if x['slug']=='$SLUG'))")"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 10)); done
          exit 1
      - name: Keep the quota record
        if: always() && steps.qa.outputs.pass != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/llm_usage 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Quota usage of requalify ${{ github.run_id }}"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 10)); done
