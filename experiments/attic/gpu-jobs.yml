name: gpu-jobs

# The episode's GPU work on Modal (gpu/modal_app.py), started from GitHub so
# nobody's computer has to stay on: the 4-bit FLUX weights are fetched into a
# Modal Volume once (CPU only), then the reconstructions and the Chatterbox
# sample run on one NVIDIA L4 each, under hard timeouts. Every call's seconds
# and estimated dollars go to state/modal_usage.json in this repository, and
# the render starts when both are done. Kaggle is not used by this channel.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: episode
        default: living-fossils
      tasks:
        description: which Modal tasks, in order
        default: "weights recon voice"
      render:
        description: start the render when the GPU work is done
        default: "true"

permissions:
  contents: write
  actions: write

concurrency:
  group: gpu-jobs
  cancel-in-progress: false

env:
  PYTHONUTF8: 1
  SLUG: ${{ inputs.slug }}
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  GH_TOKEN: ${{ github.token }}

jobs:
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt modal==1.6.2
      - name: Modal credentials (trim stray whitespace; ID is ak-, secret as-)
        run: |
          id="$(printf '%s' "$MODAL_TOKEN_ID" | tr -d '[:space:]')"
          sec="$(printf '%s' "$MODAL_TOKEN_SECRET" | tr -d '[:space:]')"
          case "$id" in as-*) t="$id"; id="$sec"; sec="$t"; echo "ID and secret were swapped";; esac
          echo "token id prefix: ${id:0:3}, secret prefix: ${sec:0:3}, lengths ${#id}/${#sec}"
          echo "::add-mask::$id"; echo "::add-mask::$sec"
          { echo "MODAL_TOKEN_ID=$id"; echo "MODAL_TOKEN_SECRET=$sec"; } >> "$GITHUB_ENV"
      - name: Kokoro (times the 30-second voice sample)
        run: python automation/fetch_models.py
      - name: Modal
        run: |
          for t in ${{ inputs.tasks }}; do
            echo "::group::$t"
            modal run gpu/modal_app.py --task "$t" --slug "$SLUG"
            echo "::endgroup::"
          done
      - name: Results
        if: always()
        run: |
          mkdir -p modal_out
          modal volume get --force prehistoric-out "$SLUG/recon/report.json" modal_out/recon_report.json || true
          modal volume get --force prehistoric-out "$SLUG/voice" modal_out/ || true
          cat state/modal_usage.json || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: gpu-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            modal_out/
            state/modal_usage.json
      - name: Keep the usage record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/modal_usage.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Modal usage after gpu-jobs ${{ github.run_id }}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
      - name: Render
        if: success() && inputs.render == 'true'
        run: gh workflow run render.yml -R "${{ github.repository }}" -f slug="$SLUG" -f res=2160p -f samples=true
